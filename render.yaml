# Render Blueprint: backend + classifier. Secrets (sync: false) are entered in the Render dashboard, never committed.
services:
  - type: web
    name: scamalert-classifier
    runtime: python
    rootDir: classifier
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: GNANI_API_KEY
        sync: false
  - type: web
    name: scamalert-backend
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: GNANI_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: CLASSIFIER_URL
        sync: false   # use the classifier's INTERNAL address (service page > Connect > Internal), e.g. http://scamalert-classifier:10000.
                      # The public https address can be bot-challenged by Render's edge when called server-to-server.
      - key: FRONTEND_ORIGIN
        sync: false   # e.g. https://your-app.vercel.app
      - key: RATE_LIMIT_PER_HOUR
        value: "20"
